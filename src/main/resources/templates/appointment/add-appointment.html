<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Add Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div layout:fragment="content">
    <div class="container py-0">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-calendar-plus"></i> Add New Appointment
            </div>
            <div class="card-body">
                <form th:action="@{/appointment/add}" th:object="${appointment}" method="post">

                    <!-- Patient Selection -->
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="patient">Patient</label>
                            <select th:field="*{patient.patientId}" class="form-control" id="patient" required>
                                <option value="">-- Select Patient --</option>
                                <option th:each="patient : ${patients}"
                                        th:value="${patient.patientId}"
                                        th:text="${patient.name + ' (ID: ' + patient.patientId + ')'}"
                                        th:selected="${appointment.patient != null && appointment.patient.patientId == patient.patientId}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- Doctor Selection -->
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="doctor">Doctor</label>
                            <select th:field="*{doctor.doctorId}" class="form-control" id="doctor" required>
                                <option value="">-- Select Doctor --</option>
                                <option th:each="doctor : ${doctors}"
                                        th:value="${doctor.doctorId}"
                                        th:text="${doctor.name + ' (Room: ' + doctor.room + ')'}"
                                        th:selected="${appointment.doctor != null && appointment.doctor.doctorId == doctor.doctorId}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="date">Date</label>
                            <input type="date" th:field="*{date}" class="form-control" id="date">
                            <span th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="time">Time</label>
                            <input type="time" th:field="*{time}" class="form-control" id="time">
                            <span th:if="${#fields.hasErrors('time')}" th:errors="*{time}" class="text-danger"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="status">Status</label>
                            <select th:field="*{status}" class="form-control" id="status">
                                <option value="">-- Select Status --</option>
                                <option value="Scheduled">Scheduled</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger"></span>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="remark">Remark</label>
                            <textarea th:field="*{remark}" class="form-control" id="remark" placeholder="Any notes or remarks"></textarea>
                        </div>
                    </div>

                    <div class="form-group d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-success">Save</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                        <a class="btn btn-danger" th:href="@{/appointment}">Cancel</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Update Patient</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
          integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz"
          crossorigin="anonymous">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Select2 CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        /* Match Bootstrap 4 form-control height and style */
        .select2-container--default .select2-selection--single {
            height: calc(2.25rem + 2px); /* matches .form-control */
            padding: 0.375rem 0.75rem;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 1.5;
            padding-left: 0;
            color: #495057;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 100%;
            right: 0.75rem;
        }

        /* Make sure the container expands like other form-controls */
        .select2-container {
            width: 100% !important;
        }
    </style>

</head>
<body>
<div layout:fragment="content">
    <div class="container py-0">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold d-flex ">
                <span><i class="fas fa-users"></i> Choose Patient</span>
            </div>

            <div class="card-body">
                <form class="d-flex align-items-end gap-2 flex-wrap flex-md-nowrap" method="get" th:action="@{/appointment/signup}" id="searchForm">
                    <!-- Select existing/new -->
                    <div class="form-group mb-0" style="min-width: 180px;">
                        <select class="form-control" id="searchBy" onchange="handlePatientTypeChange()">
                            <option value="existing">Existing Patient</option>
                            <option value="new">New Patient</option>
                        </select>
                    </div>

                    <!-- Select2 dropdown -->
                    <div class="form-group mb-0 flex-grow-1" id="patientDropdownWrapper">
                        <select name="patientId" th:field="*{patient.patientId}" class="form-control" id="patientSelect">
                            <option value="">-- Select Patient --</option>
                            <option th:each="patient : ${patients}"
                                    th:value="${patient.patientId}"
                                    th:text="${patient.name + ' (No Phone: ' + patient.phone + ')'}"
                                    th:selected="${appointment.patient != null && appointment.patient.patientId == patient.patientId}">
                            </option>
                        </select>
                    </div>

                    <!-- Action Button -->
                    <div class="form-group mb-0">
                        <!-- This anchor will be changed dynamically -->
                        <a id="actionButton" class="btn btn-primary mt-2" onclick="submitFormOrRedirect(event)">
                            <i class="fas fa-search"></i>
                        </a>
                    </div>
                </form>
            </div>

            <script>
                $(document).ready(function () {
                    $('#patientSelect').select2({
                        placeholder: "Search patient",
                        allowClear: true
                    });

                    handlePatientTypeChange(); // initialize
                });

                function handlePatientTypeChange() {
                    const type = document.getElementById("searchBy").value;
                    const actionButton = document.getElementById("actionButton");

                    if (type === "new") {
                        $('#patientSelect').val(null).trigger('change');
                        $('#patientSelect').prop('disabled', true);
                        actionButton.innerHTML = '<i class="fas fa-user-plus"></i>';
                        actionButton.setAttribute("href", "/patient/signup");
                    } else {
                        $('#patientSelect').prop('disabled', false);
                        actionButton.innerHTML = '<i class="fas fa-search"></i>';
                        actionButton.setAttribute("href", "#");
                    }
                }

                function submitFormOrRedirect(event) {
                    const type = document.getElementById("searchBy").value;
                    if (type === "existing") {
                        document.getElementById("searchForm").submit();
                    }
                    // else, it’s a <a href="/patient/signup"> so let it redirect
                }
            </script>
        </div>


        <!-- Patient Information Card -->
        <div class="card shadow-sm border-0 mb-4" th:if="${patient != null}">
            <div class="card-header bg-light font-weight-bold d-flex">
                <span><i class="fas fa-user"></i> Patient Information</span>
            </div>

            <div class="card-body">
                <div class="row mb-2">
                    <div class="col-sm-2 text-muted">Full Name:</div>
                    <div class="col-sm-8" th:text="${patient.name}">John Doe</div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-2 text-muted">Birth Date:</div>
                    <div class="col-sm-8" th:text="${#dates.format(patient.dob, 'dd/MM/yyyy')}">01/01/1990</div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-2 text-muted">Gender:</div>
                    <div class="col-sm-8" th:text="${patient.gender}">Male</div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-2 text-muted">Phone Number:</div>
                    <div class="col-sm-8" th:text="${patient.phone}">012-3456789</div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-2 text-muted">Address:</div>
                    <div class="col-sm-8">
                        <span th:text="${patient.street}">123 Main St</span>,
                        <span th:text="${patient.postcode}">12345</span>,
                        <span th:text="${patient.city}">Kuala Lumpur</span>,
                        <span th:text="${patient.state}">Selangor</span>,
                        <span th:text="${patient.country}">Malaysia</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Only show appointment form when patient is selected -->
        <div class="card shadow-sm border-0 mb-4" th:if="${patient != null}">
            <div class="card-header bg-light font-weight-bold d-flex ">
                <span><i class="fas fa-calendar-plus"></i> Add New Appointment</span>
            </div>

            <div class="card-body">
                <form th:action="@{/appointment/add}" th:object="${appointment}" method="post">
                    <!-- Critical hidden fields -->
                    <input type="hidden" name="patientId" th:value="${patient.patientId}" />
                    <input type="hidden" name="patientOption" value="existing" />

                    <div class="form-row">
                        <!-- Doctor Selection -->
                        <div class="form-group col-md-6">
                            <label for="doctor" class="required-field">Doctor</label>
                            <select th:field="*{doctor.doctorId}" class="form-control" id="doctor" required>
                                <option value="">-- Select Doctor --</option>
                                <option th:each="doctor : ${doctors}"
                                        th:value="${doctor.doctorId}"
                                        th:text="${doctor.name + ' (Room: ' + doctor.room + ')'}">
                                </option>
                            </select>
                            <span th:if="${#fields.hasErrors('doctor.doctorId')}"
                                  th:errors="*{doctor.doctorId}"
                                  class="text-danger"></span>
                        </div>

                        <!-- Date and Time -->
                        <div class="form-group col-md-3">
                            <label for="date" class="required-field">Date</label>
                            <input type="date" th:field="*{date}" class="form-control" id="date" required>
                            <span th:if="${#fields.hasErrors('date')}"
                                  th:errors="*{date}"
                                  class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-3">
                            <label for="time" class="required-field">Time</label>
                            <!-- Ensure the name attribute matches your object property -->
                            <input type="time" th:field="*{time}" class="form-control" id="time" required>
                            <span th:if="${#fields.hasErrors('time')}" th:errors="*{time}" class="text-danger"></span>
                        </div>

                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="remark">Remark</label>
                            <textarea th:field="*{remark}" class="form-control" id="remark"
                                      placeholder="Any notes or remarks"></textarea>
                        </div>
                    </div>

                    <div class="form-group d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-success">Save Appointment</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                        <a class="btn btn-danger" th:href="@{/appointment}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Show message when no patient is selected -->
        <div class="alert alert-info" th:if="${patient == null}">
            <i class="fas fa-info-circle"></i> Please select a patient to schedule an appointment.
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        // Initialize Select2 for patient dropdown
        $('#patientSelect').select2({
            placeholder: "Search patient",
            allowClear: true
        });
    });
</script>
</body>
</html>

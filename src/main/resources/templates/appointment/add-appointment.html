<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Add Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div layout:fragment="content">
    <div class="container py-0">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-user-plus"></i> Add New Appointment
            </div>

            <div class="card-body">
                <!-- Form Starts -->
                <form th:action="@{/appointment/add}" th:object="${appointment}" method="post">

                    <!-- Hidden field to track selected patient option -->
                    <input type="hidden" id="patientOptionHidden" name="patientOption" value="existing">

                    <!-- Toggle Patient Mode -->
                    <div class="form-group">
                        <label>
                            <input type="radio" name="patientOptionRadio" value="existing" checked onchange="togglePatientMode(this.value)"> Existing Patient
                        </label>
                        <label class="ml-3">
                            <input type="radio" name="patientOptionRadio" value="new" onchange="togglePatientMode(this.value)"> New Patient
                        </label>
                    </div>

                    <!-- Existing Patient Dropdown -->
                    <div id="patientDropdownContainer" class="form-row">
                        <div class="form-group col-md-6">
                            <label for="patient">Existing Patient</label>
                            <select th:field="*{patient.patientId}" class="form-control" id="patient">
                                <option value="">-- Select Patient --</option>
                                <option th:each="patient : ${patients}"
                                        th:value="${patient.patientId}"
                                        th:text="${patient.name + ' (ID: ' + patient.patientId + ')'}"
                                        th:selected="${appointment.patient != null && appointment.patient.patientId == patient.patientId}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <!-- New Patient Fields -->
                    <div id="newPatientFields">
                        <div class="form-row">
                            <div class="form-group col-md-12">
                                <label for="name">Full Name</label>
                                <input type="text" th:field="*{patient.name}" class="form-control" id="name" placeholder="Patient Full Name">
                                <span th:if="${#fields.hasErrors('patient.name')}" th:errors="*{patient.name}" class="text-danger"></span>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="gender">Gender</label>
                                <input type="text" th:field="*{patient.gender}" class="form-control" id="gender" placeholder="Gender">
                                <span th:if="${#fields.hasErrors('patient.gender')}" th:errors="*{patient.gender}" class="text-danger"></span>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="phone">Phone Number</label>
                                <input type="text" th:field="*{patient.phone}" class="form-control" id="phone" placeholder="Phone Number">
                                <span th:if="${#fields.hasErrors('patient.phone')}" th:errors="*{patient.phone}" class="text-danger"></span>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="dob">Date of Birth</label>
                                <input type="date" th:field="*{patient.dob}" class="form-control" id="dob">
                                <span th:if="${#fields.hasErrors('patient.dob')}" th:errors="*{patient.dob}" class="text-danger"></span>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-12">
                                <label for="street">Street</label>
                                <input type="text" th:field="*{patient.street}" class="form-control" id="street" placeholder="Street">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="city">City</label>
                                <input type="text" th:field="*{patient.city}" class="form-control" id="city" placeholder="City">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="postcode">Postcode</label>
                                <input type="text" th:field="*{patient.postcode}" class="form-control" id="postcode" placeholder="Postcode">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="state">State</label>
                                <input type="text" th:field="*{patient.state}" class="form-control" id="state" placeholder="State">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="country">Country</label>
                                <input type="text" th:field="*{patient.country}" class="form-control" id="country" placeholder="Country">
                            </div>
                        </div>
                    </div>

                    <!-- Appointment Details -->
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="doctor">Doctor</label>
                            <select th:field="*{doctor.doctorId}" class="form-control" id="doctor" required>
                                <option value="">-- Select Doctor --</option>
                                <option th:each="doctor : ${doctors}"
                                        th:value="${doctor.doctorId}"
                                        th:text="${doctor.name + ' (Room: ' + doctor.room + ')'}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="date">Date</label>
                            <input type="date" th:field="*{date}" class="form-control" id="date">
                            <span th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="time">Time</label>
                            <input type="time" th:field="*{time}" class="form-control" id="time">
                            <span th:if="${#fields.hasErrors('time')}" th:errors="*{time}" class="text-danger"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="status">Status</label>
                            <select th:field="*{status}" class="form-control" id="status">
                                <option value="">-- Select Status --</option>
                                <option value="Scheduled">Scheduled</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                            <span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="remark">Remark</label>
                            <textarea th:field="*{remark}" class="form-control" id="remark" placeholder="Any notes or remarks"></textarea>
                        </div>
                    </div>

                    <div class="form-group d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-success">Save</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                        <a class="btn btn-danger" th:href="@{/appointment}">Cancel</a>
                    </div>

                </form>
                <!-- Form Ends -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS + Custom Toggle Script -->
<script>
    function togglePatientMode(value) {
        document.getElementById('patientOptionHidden').value = value;

        const dropdown = document.getElementById('patientDropdownContainer');
        const newFields = document.getElementById('newPatientFields');

        if (value === 'existing') {
            dropdown.style.display = 'flex';
            newFields.style.display = 'none';
        } else {
            dropdown.style.display = 'none';
            newFields.style.display = 'block';
        }
    }

    // Set default on load
    window.onload = function () {
        togglePatientMode('existing');
    };
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

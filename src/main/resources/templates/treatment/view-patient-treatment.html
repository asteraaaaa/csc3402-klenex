<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Patient Treatment History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
        .center-align { text-align: center; }
        .detail-section { border-top: 2px solid #ccc; padding-top: 15px; margin-top: 30px; }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-2">
        <h4 class="mb-3">Patient: <span th:text="${patient.name}">John Doe</span></h4>

        <!-- Treatment History Table -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-history"></i> Medical History
            </div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0" id="treatmentTable">
                        <thead class="table-primary">
                        <tr>
                            <th>Date</th>
                            <th>Doctor</th>
                            <th>Diagnosis</th>
                            <th>Prescription</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="treatment : ${treatments}">
                            <td th:text="${#dates.format(treatment.appointment.date, 'dd-MM-yyyy')}">01-01-2025</td>
                            <td th:text="${treatment.appointment.doctor.name}">Dr. Smith</td>
                            <td th:text="${treatment.diagnosis}">Flu</td>
                            <td th:text="${treatment.prescription}">Panadol</td>
                            <td>
                                <button class="btn btn-sm btn-outline-info"
                                        th:attr="
            data-date=${#dates.format(treatment.appointment.date, 'yyyy-MM-dd')},
            data-doctor=${treatment.appointment.doctor.name},
            data-diagnosis=${treatment.diagnosis},
            data-prescription=${treatment.prescription},
            data-room=${treatment.appointment.doctor.room},
            data-meds=${treatment.medications}"
                                        onclick="showDetails(this)">
                                    View
                                </button>


                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Treatment Details Section -->
        <div class="card detail-section shadow-sm border-0" id="treatmentDetails" style="display: none;">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-file-medical"></i> Treatment Details
            </div>
            <div class="card-body">
                <p><strong>Date:</strong> <span id="detailDate">-</span></p>
                <p><strong>Doctor:</strong> <span id="detailDoctor">-</span></p>
                <p><strong>Diagnosis:</strong> <span id="detailDiagnosis">-</span></p>
                <p><strong>Prescription:</strong> <span id="detailPrescription">-</span></p>
                <p><strong>Medications:</strong> <ul id="detailMedications"></ul></p>
                <p><strong>Room:</strong> <span id="detailRoom">-</span></p>
            </div>
        </div>
    </div>
</div>

<!-- JS logic to show details -->
<script>
    function showDetails(btn) {
        const $btn = $(btn);
        $('#detailDate').text(formatDate($btn.data('date')));
        $('#detailDoctor').text($btn.data('doctor'));
        $('#detailDiagnosis').text($btn.data('diagnosis'));
        $('#detailPrescription').text($btn.data('prescription'));
        $('#detailRoom').text($btn.data('room'));

        const meds = $btn.data('meds');
        const medList = $('#detailMedications');
        medList.empty();

        if (Array.isArray(meds)) {
            meds.forEach(m => medList.append(`<li>${m.name}</li>`));
        } else {
            medList.append(`<li>No medications</li>`);
        }

        $('#treatmentDetails').show();
    }

</script>

</body>
</html>

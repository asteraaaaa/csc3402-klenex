<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>View Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <div class="card shadow-sm">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-calendar-alt"></i> Appointment Details
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <h5>Patient Information</h5>
                        <p><strong>Name:</strong> <span th:text="${appointment.patient.name}"></span></p>
                        <p><strong>ID:</strong> <span th:text="${appointment.patient.patientId}"></span></p>
                        <p><strong>Phone:</strong> <span th:text="${appointment.patient.phone}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <h5>Doctor Information</h5>
                        <p><strong>Name:</strong> <span th:text="${appointment.doctor.name}"></span></p>
                        <p><strong>Room:</strong> <span th:text="${appointment.doctor.room}"></span></p>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <h5>Appointment Details</h5>
                        <p><strong>Date:</strong> <span th:text="${appointment.date}"></span></p>
                        <p><strong>Time:</strong> <span th:text="${appointment.time}"></span></p>
                        <p><strong>Status:</strong> <span th:text="${appointment.status}"></span></p>
                    </div>
                    <div class="col-md-6">
                        <h5>Notes</h5>
                        <p th:text="${appointment.remark ?: 'No remarks'}"></p>
                    </div>
                </div>

                <div class="d-flex justify-content-end">
                    <a th:href="@{/appointment}" class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i> Back to List
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

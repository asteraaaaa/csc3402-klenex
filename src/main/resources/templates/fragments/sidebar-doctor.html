<div th:fragment="sidebar">
    <nav id="sidebar" class="sidebar d-flex flex-column bg-light border-end">
        <ul class="nav flex-column pt-3">

            <li class="nav-item">
                <a class="nav-link">
                    <img th:with="avatar=${doctor.image != null and !#strings.isEmpty(doctor.image) ? doctor.image : 'default-avatar.svg'}"
                         th:src="@{/images/{file}(file=${avatar})}" alt="Doctor Image" class="nav-link-text rounded-circle mb-2" style="width: 80px; height: 80px; object-fit: cover;">
                    <h5 class="nav-link-text mb-0" th:text="${doctor.name}"></h5>
                    <small class="nav-link-text text-muted" th:text="'Room: ' + ${doctor.room}"></small>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/}"
                   th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
                    <i class="bi bi-speedometer2 me-2"></i>
                    <span class="nav-link-text">Dashboard</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/patient}"
                   th:classappend="${activePage == 'patient'} ? ' active' : ''">
                    <i class="fas fa-hospital-user me-2"></i>
                    <span class="nav-link-text">Patients</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/treatment}"
                   th:classappend="${activePage == 'treatment'} ? ' active' : ''">
                    <i class="fas fa-stethoscope me-2"></i>
                    <span class="nav-link-text">Treatments</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/appointment}"
                   th:classappend="${activePage == 'appointment'} ? ' active' : ''">
                    <i class="bi bi-calendar2-check me-2"></i>
                    <span class="nav-link-text">Appointments</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

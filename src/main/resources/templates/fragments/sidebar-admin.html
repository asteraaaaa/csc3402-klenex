<div th:fragment="sidebar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav id="sidebar" class="sidebar d-flex flex-column bg-light border-end">
        <ul class="nav flex-column pt-3">

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/}"
                   th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
                    <i class="bi bi-speedometer2 me-2"></i>
                    <span class="nav-link-text">Dashboard</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/doctor}"
                   th:classappend="${activePage == 'doctor'} ? ' active' : ''">
                    <i class="fas fa-user-doctor me-2"></i>
                    <span class="nav-link-text">Doctors</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/patient}"
                   th:classappend="${activePage == 'patient'} ? ' active' : ''">
                    <i class="fas fa-hospital-user me-2"></i>
                    <span class="nav-link-text">Patients</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/medication}"
                   th:classappend="${activePage == 'medication'} ? ' active' : ''">
                    <i class="fas fa-capsules me-2"></i>
                    <span class="nav-link-text">Medications</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/treatment}"
                   th:classappend="${activePage == 'treatment'} ? ' active' : ''">
                    <i class="fas fa-stethoscope me-2"></i>
                    <span class="nav-link-text">Treatments</span>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/appointment}"
                   th:classappend="${activePage == 'appointment'} ? ' active' : ''">
                    <i class="bi bi-calendar2-check me-2"></i>
                    <span class="nav-link-text">Appointments</span>
                </a>
            </li>

            <!-- Only admins can manage accounts and roles -->
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link"
                   th:href="@{/admin/users}"
                   th:classappend="${activePage == 'users'} ? ' active' : ''">
                    <i class="bi bi-people me-2"></i>
                    <span class="nav-link-text">Users</span>
                </a>
            </li>

        </ul>
    </nav>
</div>

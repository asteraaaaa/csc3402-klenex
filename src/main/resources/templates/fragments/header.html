<div th:fragment="header">
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <!-- Sidebar Toggle Here -->
    <button class="toggle-btn" id="sidebarToggle" aria-label="Toggle Sidebar">
      <i class="bi bi-list fs-3"></i>
    </button>

    <div class="container-fluid">

      <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
        <i class="fas fa-stethoscope me-2"></i>
        <span class = font-weight-bold>Klenex</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
               data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account menu">
              <i class="fas fa-user"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
              <!-- Logging out must be a POST with the CSRF token; a plain link would not end the session. -->
              <li>
                <form th:action="@{/logout}" method="post" class="m-0">
                  <button type="submit" class="dropdown-item">Logout</button>
                </form>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>

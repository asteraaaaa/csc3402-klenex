<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Update Medication</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div layout:fragment="content">
    <div class="container py-0">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-pills"></i> Update Medication
            </div>
            <div class="card-body">
                <form th:action="@{/medication/update/{id}(id=${medication.drugId})}" th:object="${medication}" method="post">
                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label for="name">Name</label>
                            <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Medication Name">
                            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="medicationGroup">Medication Group</label>
                            <select th:field="*{medicationGroup}" class="form-control" id="medicationGroup">
                                <option th:each="group : ${T(com.klenex.health.klenex.model.MedicationGroup).values()}"
                                        th:value="${group}"
                                        th:text="${group}"></option>
                            </select>
                            <span th:if="${#fields.hasErrors('medicationGroup')}" th:errors="*{medicationGroup}" class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="dosageForm">Dosage Form</label>
                            <select th:field="*{dosageForm}" class="form-control" id="dosageForm">
                                <option th:each="form : ${T(com.klenex.health.klenex.model.DosageForm).values()}"
                                        th:value="${form}"
                                        th:text="${form}"></option>
                            </select>
                            <span th:if="${#fields.hasErrors('dosageForm')}" th:errors="*{dosageForm}" class="text-danger"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="strength">Strength</label>
                            <input type="text" th:field="*{strength}" class="form-control" id="strength" placeholder="e.g., 500mg, 10mg/mL">
                            <span th:if="${#fields.hasErrors('strength')}" th:errors="*{strength}" class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="quantity">Quantity</label>
                            <input type="number" th:field="*{quantity}" class="form-control" id="quantity" placeholder="Quantity">
                            <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}" class="text-danger"></span>
                        </div>
                    </div>

                    <div class="form-group d-flex justify-content-end gap-2">
                        <button type="submit" name="action" value="delete" class="btn btn-danger" onclick="return confirm('Are you sure?')">Delete</button>
                        <button type="submit" name="action" value="update" class="btn btn-success">Update</button>
                        <a class="btn btn-secondary" th:href="@{/medication}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

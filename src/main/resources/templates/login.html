<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Login</title>
    <style>
        :root {
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --border-color: #dee2e6;
            --text-muted: #6c757d;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            min-height: 100vh;
            align-items: center;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }

        .login-card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .login-header {
            background-color: white;
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .login-header h1 {
            font-weight: 600;
            color: #212529;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: var(--text-muted);
            margin-bottom: 0;
        }

        .login-body {
            padding: 2rem;
            background-color: white;
        }

        .form-control {
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-login {
            background-color: var(--primary);
            border: none;
            padding: 12px;
            font-weight: 500;
            width: 100%;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .form-floating label {
            color: var(--text-muted);
        }

        .alert {
            border-radius: 8px;
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem;
            background-color: white;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            transition: all 0.3s;
        }
        .social-btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="login-card">
                <div class="login-header">
                    <h2><i class="fas fa-hospital me-2"></i>Klenex</h2>
                    <p class="mb-0">Please login to your account</p>
                </div>

                <div class="p-4">
                    <div th:if="${param.error}">
                        <div class="alert alert-danger d-flex align-items-center">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            Invalid Email or Password!
                        </div>
                    </div>
                    <div th:if="${param.logout}">
                        <div class="alert alert-success d-flex align-items-center">
                            <i class="fas fa-check-circle me-2"></i>
                            You have been logged out successfully!
                        </div>
                    </div>

                    <form method="post" role="form" th:action="@{/login}">
                        <div class="mb-3">
                            <label class="form-label" for="username">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input class="form-control" id="username" name="username"
                                       placeholder="Enter your email" type="email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input class="form-control" id="password" name="password"
                                       placeholder="Enter your password" type="password" required>
                            </div>
                            <div class="text-end mt-2">
                                <a href="#" class="text-decoration-none">Forgot password?</a>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>

                        <div class="mb-3">
                            <button class="btn btn-login mb-3" type="submit">
                                <i class="fas fa-sign-in-alt me-2"></i>Login
                            </button>
                        </div>

                        <div class="divider">OR</div>

                        <div class="social-login mb-4">
                            <a href="#" class="social-btn" style="background: #3b5998;">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a href="#" class="social-btn" style="background: #db4437;">
                                <i class="fab fa-google"></i>
                            </a>
                            <a href="#" class="social-btn" style="background: #1DA1F2;">
                                <i class="fab fa-twitter"></i>
                            </a>
                        </div>

                        <div class="text-center">
                            Don't have an account?
                            <a class="link-primary text-decoration-none fw-bold" th:href="@{/registration}">
                                Register here
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script crossorigin="anonymous"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>

</body>
</html>

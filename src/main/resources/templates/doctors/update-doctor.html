<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <title>Update Doctor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.4.1/css/all.css"
          integrity="sha384-5sAR7xN1Nv6T6+dT2mhtzEpVJvfS3NScPQTrOxhwjIuvcA67KV2R5Jz6kr4abQsz"
          crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <a class="navbar-brand" href="#">UPDATE DOCTOR >> </a>
    <button class="navbar-toggler " type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href = "#" th:href ="@{/}">Main Menu</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <h3> Update Doctor</h3>
    <div class="card">
        <div class="card-body">
            <div class="col-md-8">
                <form action="#"
                      th:action="@{/doctors/update/{id}(id=${doctor.doctorId})}"
                      th:object="${doctor}" th:method="post">
                    <div class="row">
                        <div class="form-group col-md-8">
                            <label for="doctorId" class="col-form-label">Doctor ID</label>
                            <input type="text" th:field="*{doctorId}" class="form-control" id="doctorId"
                                   placeholder="Doctor ID" readonly>
                            <span th:if="${#fields.hasErrors('doctorId')}" th:errors="*{doctorId}"
                                  class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-8">
                            <label for="name" class="col-form-label">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" id="name"
                                   placeholder="Doctor Full Name">
                            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                                  class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-8">
                            <label for="room" class="col-form-label">Room</label>
                            <input type="text" th:field="*{room}" class="form-control" id="room"
                                   placeholder="Room">
                            <span th:if="${#fields.hasErrors('room')}" th:errors="*{room}"
                                  class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-8">
                            <label for="phone" class="col-form-label">Phone Number</label>
                            <input type="text" th:field="*{phone}" class="form-control" id="phone"
                                   placeholder="Phone Number">
                            <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
                                  class="text-danger"></span>
                        </div>
                        <div class="form-group col-md-8">
                            <label for="street">Street</label>
                            <input type="text" th:field="*{street}" class="form-control" id="street" placeholder="Street">
                        </div>
                        <div class="form-group col-md-8">
                            <label for="city">City</label>
                            <input type="text" th:field="*{city}" class="form-control" id="city" placeholder="City">
                        </div>
                        <div class="form-group col-md-8">
                            <label for="state">State</label>
                            <input type="text" th:field="*{state}" class="form-control" id="state" placeholder="State">
                        </div>
                        <div class="form-group col-md-8">
                            <label for="postcode">Postcode</label>
                            <input type="text" th:field="*{postcode}" class="form-control" id="postcode" placeholder="Postcode">
                        </div>
                        <div class="form-group col-md-8">
                            <label for="country">Country</label>
                            <input type="text" th:field="*{country}" class="form-control" id="country" placeholder="Country">
                        </div>

                        <div class="container">
                            <input type="submit" class="btn btn-success" value="Update">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>

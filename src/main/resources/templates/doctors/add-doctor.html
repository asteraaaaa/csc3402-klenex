<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <title>Add Doctor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <a class="navbar-brand" href="#"> ADD DOCTOR >> </a>
    <button class="navbar-toggler " type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="#" th:href="@{/}">Main Menu</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/doctors/list" th:href="@{/doctors/list}">Back to Doctor List</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container my-5">
    <h3> Add Doctor </h3>
    <div class="card">
        <div class="card-body">
            <form action="#" th:action="@{/doctors/add}" th:object="${doctor}" method="post">
                <div class="row">
                    <div class="form-group col-md-8">
                        <label for="name" class="col-form-label">Full Name</label> <input
                            type="text" th:field="*{name}" class="form-control" id="name"
                            placeholder="Doctor Full Name"> <span
                            th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                            class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-8">
                        <label for="room" class="col-form-label">Room</label> <input
                            type="text" th:field="*{room}" class="form-control" id="room"
                            placeholder="Room"> <span
                            th:if="${#fields.hasErrors('room')}" th:errors="*{room}"
                            class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-8">
                        <label for="phone" class="col-form-label">Phone Number</label> <input
                            type="text" th:field="*{phone}" class="form-control" id="phone"
                            placeholder="Phone Number"> <span
                            th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
                            class="text-danger"></span>
                    </div>
                    <div class="form-group col-md-8">
                        <label for="street">Street</label>
                        <input type="text" th:field="*{street}" class="form-control" id="street" placeholder="Street">
                    </div>

                    <div class="form-group col-md-8">
                        <label for="city">City</label>
                        <input type="text" th:field="*{city}" class="form-control" id="city" placeholder="City">
                    </div>

                    <div class="form-group col-md-8">
                        <label for="state">State</label>
                        <input type="text" th:field="*{state}" class="form-control" id="state" placeholder="State">
                    </div>

                    <div class="form-group col-md-8">
                        <label for="postcode">Postcode</label>
                        <input type="text" th:field="*{postcode}" class="form-control" id="postcode" placeholder="Postcode">
                    </div>

                    <div class="form-group col-md-8">
                        <label for="country">Country</label>
                        <input type="text" th:field="*{country}" class="form-control" id="country" placeholder="Country">
                    </div>


                    <div class="container">
                        <input type="submit" id="submitButton" class="btn btn-success" th:value="Save">
                        <input type="reset" id="resetButton" class="btn btn-danger" th:value="Reset"/>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

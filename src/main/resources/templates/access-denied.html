<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access denied - Klenex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-box { max-width: 520px; margin: 8vh auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="card card-box shadow-sm border-0">
        <div class="card-body p-4 text-center">
            <i class="fas fa-lock fa-3x text-danger mb-3"></i>
            <h1 class="h4 fw-bold">Access denied</h1>
            <p class="text-muted">Your account's role does not allow you to open that page.</p>
            <a th:href="@{/}" class="btn btn-primary"><i class="fas fa-house me-1"></i>Back to my dashboard</a>
        </div>
    </div>
</div>
</body>
</html>

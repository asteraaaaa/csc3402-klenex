<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Doctor Directory</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-dark bg-primary shadow-sm">
    <a class="navbar-brand font-weight-bold" href="#">👨‍⚕️ Doctors</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a class="nav-link" href="#" th:href="@{/}"><i class="fas fa-home"></i> Main Menu</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container py-5">

    <!-- Search Form Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <form class="form-row">
                <div class="form-group col-md-3">
                    <label for="searchBy" class="font-weight-bold">Search By</label>
                    <select class="form-control" id="searchBy">
                        <option>Doctor ID</option>
                        <option>Name</option>
                        <option>Room</option>
                        <option>Phone</option>
                    </select>
                </div>
                <div class="form-group col-md-7">
                    <label for="searchTerm" class="font-weight-bold">Search Term</label>
                    <input type="text" class="form-control" id="searchTerm" placeholder="Type here...">
                </div>
                <div class="form-group col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-search"></i> Search</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Patients Table -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-light font-weight-bold">
            <i class="fas fa-users"></i> Doctor List
        </div>
        <div class="card-body p-3">
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover mb-0">
                    <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Room</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Specialty</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${doctors.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-3">No Doctors Available</td>
                    </tr>
                    <tr th:each="doctor : ${doctors}" class = ''>
                        <td th:text="${doctor.doctorId}"></td>
                        <td th:text="${doctor.name}"></td>
                        <td th:text="${doctor.room}"></td>
                        <td th:text="${doctor.phone}"></td>
                        <td th:text="${doctor.street + ', ' + doctor.city + ', ' + doctor.state + ', ' + doctor.postcode + ', ' + doctor.country}"></td>
                        <td class="text-nowrap">
                            <button class="btn btn-info btn-sm me-2">👁️</button>
                            <form th:action="@{/templates/doctor/update/{id}(id=${doctor.doctorId})}" method="get" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i> ✏️
                                </button>
                            </form>

                            <form th:action="@{/templates/doctor/delete/{id}(id=${doctor.doctorId})}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this doctor?');">
                                    <i class="fas fa-trash-alt"></i> 🗑️
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add New Button -->
        <div class="card-footer text-right bg-white ">
            <form th:action="@{/templates/doctor/signup}" method="get" class="d-inline">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> Add New Doctor
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

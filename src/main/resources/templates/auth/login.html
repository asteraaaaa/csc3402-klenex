<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Clinical Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .login-header {
            background-color: #243e56;
            color: white;
            text-align: center;
            padding: 1.5rem;
        }
        .login-header h2 {
            margin: 0;
        }
        .login-body {
            padding: 2rem;
        }
        .form-control {
            border-radius: 8px;
        }
        .btn-primary {
            border-radius: 8px;
        }
        .demo-note {
            font-size: 0.875rem;
            text-align: center;
            margin-top: 1rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="login-card bg-white">
    <div class="login-header">
        <h2>🏥 Klenex </h2>
        <p class="mb-0">Please sign in to continue</p>
    </div>
    <div class="login-body">
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Sign In</button>
            </div>
        </form>
        <p class="demo-note mt-3">Demo credentials: <br> <strong>username:</strong> admin, <strong>password:</strong> password</p>
    </div>
</div>
</body>
</html>

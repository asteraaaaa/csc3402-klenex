<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doctor Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.4.1/css/all.css" crossorigin="anonymous">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Doctors</h2>
        <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#doctorModal">Add Doctor</button>
    </div>

    <div class="input-group mb-4">
        <input type="text" class="form-control" id="searchInput" placeholder="Search doctors..." onkeyup="searchDoctors()">
        <button class="btn btn-dark" onclick="searchDoctors()">Search</button>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="doctorGrid">
        <div class="col" th:each="doctor : ${doctors}">
            <div class="card h-100">
                <img th:src="${doctor.image}" class="card-img-top" alt="Doctor Image" style="object-fit: cover; height: 200px;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${doctor.name}">Doctor Name</h5>
                    <p class="card-text"><strong>ID:</strong> <span th:text="${doctor.doctorId}"></span></p>
                    <p class="card-text"><strong>Room:</strong> <span th:text="${doctor.room}"></span></p>
                    <p class="card-text"><strong>Phone:</strong> <span th:text="${doctor.phone}"></span></p>
                    <p class="card-text"><strong>Email:</strong> <span th:text="${doctor.email}"></span></p>
                    <p class="card-text"><strong>Address:</strong><br>
                        <span th:text="${doctor.street} + ', '"></span>
                        <span th:text="${doctor.city} + ', '"></span>
                        <span th:text="${doctor.state} + ' '"></span>
                        <span th:text="${doctor.postcode} + ', '"></span>
                        <span th:text="${doctor.country}"></span>
                    </p>
                </div>
                <div class="card-footer d-flex justify-content-between">
                    <a th:href="@{/doctors/update/{id}(id=${doctor.doctorId})}" class="btn btn-success">
                        <i class="fas fa-user-edit"></i>
                    </a>
                    <form th:action="@{/doctors/delete/{id}(id=${doctor.doctorId})}" method="post">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?')">
                            <i class="fas fa-user-times"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Adding Doctor -->
<div class="modal fade" id="doctorModal" tabindex="-1" aria-labelledby="doctorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Doctor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form th:action="@{/doctors/save}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Room</label>
                            <input type="text" class="form-control" name="room" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Street</label>
                            <input type="text" class="form-control" name="street" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" name="city" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">State</label>
                            <input type="text" class="form-control" name="state" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Postcode</label>
                            <input type="text" class="form-control" name="postcode" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Country</label>
                            <input type="text" class="form-control" name="country" required>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="text" class="form-control" name="image" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Doctor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function searchDoctors() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('#doctorGrid .col');
        cards.forEach(card => {
            const name = card.querySelector('.card-title').textContent.toLowerCase();
            card.style.display = name.includes(query) ? '' : 'none';
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .center-align {
            text-align: center;
        }

        .stat-card {
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .progress-thin {
            height: 5px;
        }

        .diagnosis-item {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .diagnosis-item:last-child {
            border-bottom: none;
        }

        .big-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
            line-height: 1;
        }
    </style>

</head>

<body>
<div layout:fragment="content">
    <div class="container py-0">
        <h3 class="mb-4">Admin Dashboard</h3>

        <!-- Add this right below the opening container div, before the stats cards -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form th:action="@{/dashboard}" method="get" class="d-flex align-items-end gap-2 flex-wrap flex-md-nowrap">
                    <div class="form-group mb-0" style="min-width: 180px;">
                        <label for="searchBy" class="font-weight-bold">Search By</label>
                        <select class="form-control" id="searchBy" name="searchBy">
                            <option value="patient">Patient Name</option>
                            <option value="doctor">Doctor Name</option>
                            <option value="date">Date</option>
                            <option value="status">Status</option>
                        </select>
                    </div>
                    <div class="form-group flex-grow-1 mb-0">
                        <label for="searchTerm" class="font-weight-bold">Search Term</label>
                        <input type="text" class="form-control" id="searchTerm" name="searchTerm"
                               th:value="${param.searchTerm}" placeholder="Type here...">
                    </div>
                    <div class="form-group mb-0">
                        <button type="submit" class="btn btn-primary mt-2">
                            <i class="fas fa-search"></i> Search
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Stats Cards Row -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card stat-card text-center shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-person-badge text-primary big-icon"></i>
                        <h2 class="card-title" th:text="${dashboardStats.totalDoctors}">0</h2>
                        <h5 class="card-title">Total Doctors</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card text-center shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-people text-success big-icon"></i>
                        <h2 class="card-title" th:text="${dashboardStats.totalPatients}">0</h2>
                        <h5 class="card-title">Total Patients</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card text-center shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-calendar-check text-info big-icon"></i>
                        <h2 class="card-title" th:text="${dashboardStats.totalAppointments}">0</h2>
                        <h5 class="card-title">Total Appointments</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card stat-card text-center shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-capsule text-warning big-icon"></i>
                        <h2 class="card-title" th:text="${dashboardStats.totalMedications}">0</h2>
                        <h5 class="card-title">Total Medications</h5>
                    </div>
                </div>
            </div>
        </div>

        <!-- Middle Cards Row -->
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-light font-weight-bold">
                        <i class="fas fa-calendar-week"></i> Appointments This Week
                    </div>
                    <div class="card-body">
                        <div th:each="day : ${weeklyAppointments}">
                            <div class="d-flex justify-content-between mb-3">
                                <span th:text="${day.key}">Day</span>
                                <span class="badge bg-primary">
                                    <span th:text="${day.value}">0</span> appointments
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-light font-weight-bold">
                        <i class="fas fa-diagnoses"></i> Common Diagnosis
                    </div>
                    <div class="card-body">
                        <div th:each="diagnosis, stat : ${commonDiagnoses}" class="diagnosis-item">
                            <div class="d-flex justify-content-between">
                                <span th:text="${diagnosis.name}">Diagnosis</span>
                                <span class="text-muted" th:text="${diagnosis.percentage} + '%'">0%</span>
                            </div>
                            <div class="progress progress-thin mt-2">
                                <div class="progress-bar"
                                     th:classappend="${stat.index == 0} ? 'bg-danger' :
                                                    ${stat.index == 1} ? 'bg-warning' :
                                                    ${stat.index == 2} ? 'bg-info' :
                                                    ${stat.index == 3} ? 'bg-success' : 'bg-primary'"
                                     th:style="'width:' + ${diagnosis.percentage} + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Appointments Table -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-calendar-day"></i> Recent Appointments
            </div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th class="center-align">#</th>
                            <th>Patient Name</th>
                            <th>Doctor</th>
                            <th class="center-align">Date</th>
                            <th class="center-align">Time</th>
                            <th class="center-align">Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${recentAppointments.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-3">No Recent Appointments</td>
                        </tr>
                        <tr th:each="appointment, iterStat : ${recentAppointments}">
                            <td class="center-align" th:text="${iterStat.count}"></td>
                            <td th:text="${appointment.patientName}"></td>
                            <td th:text="${appointment.doctorName}"></td>
                            <td class="center-align" th:text="${#dates.format(appointment.date, 'dd-MM-yyyy')}"></td>
                            <td class="center-align" th:text="${#temporals.format(appointment.time, 'HH:mm')}"></td>
                            <td class="center-align">
                                <span th:switch="${appointment.status}" class="badge"
                                      th:classappend="${appointment.status == 'Confirmed'} ? 'badge-success' :
                                                     ${appointment.status == 'Pending'} ? 'badge-warning' : 'badge-secondary'">
                                    <span th:text="${appointment.status}"></span>
                                </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-end bg-white">
                <a href="/appointments" class="btn btn-primary">
                    <i class="fas fa-list"></i> View All Appointments
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

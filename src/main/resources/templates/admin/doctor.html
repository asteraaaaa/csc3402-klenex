<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Doctor</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-0">

        <div class="mb-4">
            <form action="/doctor/search" method="get" class="mb-4 d-flex">
                <input type="text" name="keyword" class="form-control me-2" placeholder="Search doctors by name..." required>
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>

        <div class="card-footer d-flex justify-content-end bg-white mb-4">
            <a href="/doctor/signup" class="btn btn-success">
                <i class="fas fa-plus-circle"></i> Add New Doctor
            </a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${doctors != null}">
            <div th:if="${#lists.isEmpty(doctors)}" class="col">
                <div class="alert alert-warning w-100 text-center">
                    No doctors found.
                </div>
            </div>

            <div class="col" th:each="doctor : ${doctors}">
                <div class="card h-100 doctor-card">
                    <img th:src="@{/images/{img}(img=${doctor.image})}" class="card-img-top" alt="Doctor Image" style="object-fit: cover; height: 200px;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${doctor.name}"></h5>
                        <p class="card-text mb-1"><strong>ID:</strong> <span th:text="${doctor.doctorId}"></span></p>
                        <p class="card-text mb-1"><strong>Room:</strong> <span th:text="${doctor.room}"></span></p>
                        <p class="card-text mb-1"><strong>Phone:</strong> <span th:text="${doctor.phone}"></span></p>
                        <p class="card-text mb-1"><strong>Email:</strong> <span th:text="${doctor.email}"></span></p>
                        <p class="card-text mb-1"><strong>Address:</strong><br>
                            <span th:text="${doctor.street} + ', '"></span>
                            <span th:text="${doctor.city} + ', '"></span>
                            <span th:text="${doctor.state} + ' '"></span>
                            <span th:text="${doctor.postcode} + ', '"></span>
                            <span th:text="${doctor.country}"></span>
                        </p>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <a th:href="@{/doctor/update/{id}(id=${doctor.doctorId})}" class="btn btn-success">
                            <i class="fas fa-user-edit"></i>
                        </a>
                        <form th:action="@{/doctor/delete/{id}(id=${doctor.doctorId})}" method="get">
                            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure?')">
                                <i class="fas fa-user-times"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filterDoctors() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase();
        const cards = document.querySelectorAll('.doctor-card');

        cards.forEach(card => {
            const name = card.querySelector('.card-title').textContent.toLowerCase();
            card.closest('.col').style.display = name.includes(filter) ? '' : 'none';
        });
    }
</script>
</body>
</html>


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Patient</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-0">

        <!-- Search Form -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form class="d-flex align-items-end gap-2 flex-wrap flex-md-nowrap">
                    <div class="form-group mb-0" style="min-width: 180px;">
                        <label for="searchBy" class="font-weight-bold">Search By</label>
                        <select class="form-control" id="searchBy">
                            <option>Patient ID</option>
                            <option>Name</option>
                            <option>Phone</option>
                            <option>Gender</option>
                        </select>
                    </div>
                    <div class="form-group flex-grow-1 mb-0">
                        <label for="searchTerm" class="font-weight-bold">Search Term</label>
                        <input type="text" class="form-control" id="searchTerm" placeholder="Type here...">
                    </div>
                    <div class="form-group mb-0">
                        <button type="submit" class="btn btn-primary mt-2">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>


        <!-- Patients Table -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-users"></i> Patient List
            </div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Gender</th>
                            <th>Date of Birth</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${patients.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-3">No Patients Available</td>
                        </tr>
                        <tr th:each="patient : ${patients}" class = ''>
                            <td th:text="${patient.patientId}"></td>
                            <td th:text="${patient.name}"></td>
                            <td th:text="${patient.gender}"></td>
                            <td>
                                <span th:text="${#dates.format(patient.dob, 'dd-MM-yyyy')}"></span>
                            </td>

                            <td th:text="${patient.phone}"></td>

                            <td th:text="${patient.street + ', ' + patient.city + ', ' + patient.state + ', ' + patient.postcode + ', ' + patient.country}"></td>

                            <td class="text-nowrap">
                                <a th:href="@{/patients/view/{id}(id=${patient.patientId})}" class="btn btn-sm btn-info">👁️</a>
                                <a th:href="@{/patients/update/{id}(id=${patient.patientId})}" class="btn btn-sm btn-warning">✏️</a>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add New Button -->
            <div class="card-footer d-flex justify-content-end bg-white">
                <a href="/patients/signup" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> Add New Patient
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Font Awesome & Bootstrap JS -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

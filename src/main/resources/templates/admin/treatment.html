<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Treatments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .center-align {
            text-align: center;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-0">

        <!-- Treatment List Table -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-stethoscope"></i> Treatment List
            </div>

            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th class="center-align">ID</th>
                            <th class="center-align">Appointment ID</th>
                            <th>Diagnosis</th>
                            <th>Prescription</th>
                            <th>Medications</th>
                            <th class="center-align">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${treatments.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-3">No Treatments Available</td>
                        </tr>
                        <tr th:each="treatment : ${treatments}">
                            <td class="center-align" th:text="${treatment.treatmentId}">1</td>
                            <td class="center-align" th:text="${treatment.appointment.id}">A001</td>
                            <td th:text="${treatment.diagnosis}">Diagnosis</td>
                            <td th:text="${treatment.prescription}">Prescription</td>
                            <td>
                                <th:block th:each="med, stat : ${treatment.medications}">
                                    <span th:text="${med.name + (!stat.last ? ', ' : '')}">MedName</span>
                                </th:block>
                            </td>
                            <td class="text-nowrap center-align">
                                <a th:href="@{/treatment/view/{id}(id=${treatment.treatmentId})}" class="btn btn-sm btn-light" title="View details">
                                    <i class="fas fa-eye fa-sm"></i>
                                </a>
                                <a th:href="@{/treatment/update/{id}(id=${treatment.treatmentId})}" class="btn btn-sm btn-light" title="Edit treatment">
                                    <i class="fas fa-pencil fa-sm"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add Treatment Button -->
            <div class="card-footer d-flex justify-content-end bg-white">
                <a href="/treatment/add" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> Add New Treatment
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Treatment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .center-align {
            text-align: center;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-0">

        <!-- Treatment Table -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-notes-medical"></i> Treatment List
            </div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th class="center-align">Date</th>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Diagnosis</th>

                            <th class="center-align">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${treatments.isEmpty()}">
                            <td colspan="8" class="text-center text-muted py-3">No Treatments Available</td>
                        </tr>
                        <tr th:each="treatment : ${treatments}">
                            <td class="center-align" th:text="${#dates.format(treatment.appointment.date, 'dd-MM-yyyy')}">01-01-2025</td>
                            <td th:text="${treatment.appointment.patient.name}">John Doe</td>
                            <td th:text="${treatment.appointment.doctor.name}">Dr. Smith</td>
                            <td th:text="${treatment.diagnosis}">Flu</td>


                            <td class="text-nowrap center-align">

                                <a th:href="@{/patient/view/{id}(id=${treatment.appointment.patient.patientId})}"
                                   class="text-black"
                                   title="View details">
                                    <i class="fas fa-eye fa-sm"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

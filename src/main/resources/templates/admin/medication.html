<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Medication</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .center-align {
            text-align: center;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-0">

        <!-- Search Form -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form class="d-flex align-items-end gap-2 flex-wrap flex-md-nowrap">
                    <div class="form-group mb-0" style="min-width: 180px;">
                        <label for="searchBy" class="font-weight-bold">Search By</label>
                        <select class="form-control" id="searchBy">
                            <option>Drug ID</option>
                            <option>Name</option>
                            <option>Medication Group</option>
                            <option>Dosage Form</option>
                        </select>
                    </div>
                    <div class="form-group flex-grow-1 mb-0">
                        <label for="searchTerm" class="font-weight-bold">Search Term</label>
                        <input type="text" class="form-control" id="searchTerm" placeholder="Type here...">
                    </div>
                    <div class="form-group mb-0">
                        <button type="submit" class="btn btn-primary mt-2">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Medications Table -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-pills"></i> Medication List
            </div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th class="center-align">ID</th>
                            <th>Name</th>
                            <th>Medication Group</th>
                            <th>Strength</th>
                            <th>Dosage Form</th>
                            <th class="center-align">Quantity</th>
                            <th class="center-align">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${medications.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-3">No Medications Available</td>
                        </tr>
                        <tr th:each="medication : ${medications}">
                            <td class="center-align" th:text="${medication.drugId}"></td>
                            <td th:text="${medication.name}"></td>

                            <td th:text="${medication.medicationGroup}" ></td>

                            <td th:text="${medication.strength}"></td>

                            <td>
                                <span
                                        th:text="${medication.dosageForm}"
                                        class="badge badge-info mr-1">Panadol
                                </span>
                            </td>
                            <td class="center-align" th:text="${medication.quantity}"></td>
                            <td class="text-nowrap center-align">
                                <a th:href="@{/medication/update/{id}(id=${medication.drugId})}"
                                   class="text-black"
                                   title="Edit medication">
                                    <i class="fas fa-pencil fa-sm"></i>
                                </a>
                                <a th:href="@{/medication/delete/{id}(id=${medication.drugId})}"
                                   class="text-black ms-2"
                                   title="Delete medication"
                                   onclick="return confirm('Are you sure you want to delete this medication?');">
                                    <i class="fas fa-trash fa-sm"></i>
                                </a>
                            </td>

                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add New Button -->
            <div class="card-footer d-flex justify-content-end bg-white">
                <a href="/medication/signup" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> Add New Medication
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

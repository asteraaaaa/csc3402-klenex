<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Appointment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .center-align {
            text-align: center;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="container py-0">

        <!-- Search Form -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form th:action="@{/appointment/search}" method="get" class="d-flex align-items-end gap-2 flex-wrap flex-md-nowrap">
                    <div class="form-group mb-0" style="min-width: 180px;">
                        <label for="searchBy" class="font-weight-bold">Search By</label>
                        <select class="form-control" id="searchBy" name="searchBy">
                            <option value="patientName">Patient Name</option>
                            <option value="appointmentId">Appointment ID</option>
                            <option value="date">Date</option>
                            <option value="time">Time</option>
                            <option value="status">Status</option>
                        </select>
                    </div>
                    <div class="form-group flex-grow-1 mb-0">
                        <label for="searchTerm" class="font-weight-bold">Search Term</label>
                        <input type="text" class="form-control" id="searchTerm" name="searchTerm"
                               th:value="${param.searchTerm}" placeholder="Type here...">
                    </div>
                    <div class="form-group mb-0">
                        <button type="submit" class="btn btn-primary mt-2">
                            <i class="fas fa-search"></i> Search
                        </button>
                        <a th:href="@{/appointment}" class="btn btn-secondary mt-2 ml-2">
                            <i class="fas fa-times"></i> Clear
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Appointment Table -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-light font-weight-bold">
                <i class="fas fa-users"></i> Appointment List
            </div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-sm table-striped table-hover mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th class="center-align">ID</th>
                            <th>Patient Name</th>
                            <th class="center-align">Doctor Room</th>
                            <th class="center-align">Date</th>
                            <th class="center-align">Time</th>
                            <th class="center-align">Status</th>
                           <!-- <th class="center-align">Treatment</th> -->
                            <th>Remark</th>
                            <th class="center-align">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${appointments.isEmpty()}">
                            <td colspan="7" class="text-center text-muted py-3">No Appointments Available</td>
                        </tr>
                        <tr th:each="appointment : ${appointments}">
                            <td class="center-align" th:text="${appointment.id}"></td>
                            <td th:text="${appointment.patient != null} ? ${appointment.patient.Name} : 'N/A'">Name</td>
                            <td class="center-align" th:text="${appointment.doctor != null} ? ${appointment.doctor.room} : 'N/A'"></td>
                            <td class="center-align">
                                <span th:text="${appointment.date instanceof T(java.time.LocalDate) ? #temporals.format(appointment.date, 'dd-MM-yyyy') : #dates.format(appointment.date, 'dd-MM-yyyy')}"></span>
                            </td>
                            <td class="center-align">
                                <span th:text="${appointment.time}"></span>
                            </td>
                            <td class="center-align" th:text="${appointment.status}"></td>
                        <!--    <td class="center-align">
                                <span th:if="${appointment.treatment != null}" th:text="${appointment.treatment.name}">N/A</span>
                                <span th:unless="${appointment.treatment != null}">No Treatment</span>
                            </td>   -->
                            <td th:text="${appointment.remark}"></td>
                            <td class="text-nowrap center-align">
                                <a th:href="@{/appointment/view/{id}(id=${appointment.id})}"
                                   class="text-black"
                                   title="View details">
                                    <i class="fas fa-eye fa-sm"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Add New Button -->
            <div class="card-footer d-flex justify-content-end bg-white">
                <a href="/appointment/signup" class="btn btn-success">
                    <i class="fas fa-plus-circle"></i> Add New Appointment
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        // Highlight search terms in the table
        const searchTerm = new URLSearchParams(window.location.search).get('searchTerm');
        if (searchTerm) {
            $('td').each(function() {
                const text = $(this).text();
                const regex = new RegExp(searchTerm, 'gi');
                if (regex.test(text)) {
                    $(this).html(text.replace(regex, match =>
                        `<span class="search-highlight">${match}</span>`));
                }
            });
        }

        // Set the selected searchBy option from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const searchBy = urlParams.get('searchBy');
        if (searchBy) {
            $('#searchBy').val(searchBy);
        }
    });
</script>
</body>
</html>

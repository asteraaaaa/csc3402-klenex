spring.application.name=Klenex

spring.thymeleaf.cache=false

###
#   Database: in-memory H2 (data is lost on restart), seeded from data.sql.
###
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# For Spring Boot 2.4+ add spring.jpa.defer-datasource-initialization=true
# in application.properties
spring.jpa.defer-datasource-initialization=true

# H2 web console at /h2-console. Off by default; for local debugging set it to true
# (only a logged-in admin can open it). Never enable it on a server others can reach.
spring.h2.console.enabled=false

###
#   Hibernate Settings
#   ddl.auto = none | validate | update | create | create-drop
###
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.properties.hibernate.show_sql=false

# keep the session id in a cookie only (no ;jsessionid=... in URLs after redirects)
server.servlet.session.tracking-modes=cookie
